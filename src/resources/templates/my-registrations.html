<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Registrations | Event Management</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo1.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Header Fragment -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="main-content" style="padding-top: 40px; min-height: 80vh;">
    <div style="max-width: 1000px; margin: 0 auto;">
        <h1>My Registrations & Bookings</h1>
        <p style="color: var(--text-secondary); margin-bottom: 30px;">
            Track the status of your event registrations and venue booking requests.
        </p>

        <div th:if="${not #lists.isEmpty(bookings)}">
            <table>
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>Event / Venue</th>
                        <th>Date</th>
                        <th>Time Slot</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="b : ${bookings}">
                        <td>
                            <span th:if="${b.poster != null}" style="color: var(--accent); font-weight: 600;">EVENT</span>
                            <span th:if="${b.poster == null}" style="color: var(--primary); font-weight: 600;">VENUE</span>
                        </td>
                        <td>
                            <div th:if="${b.poster != null}">
                                <strong th:text="${b.poster.title}"></strong><br>
                                <small th:text="${'at ' + b.poster.venue}"></small>
                            </div>
                            <div th:if="${b.poster == null}">
                                <strong th:text="${b.venue != null ? b.venue.name : 'Unknown Venue'}"></strong>
                            </div>
                        </td>
                        <td th:text="${b.bookingDate}"></td>
                        <td th:text="${b.timeSlot}"></td>
                        <td>
                            <span class="badge badge-approved" th:if="${b.status == 'APPROVED'}">Registered Successfully</span>
                            <span class="badge badge-rejected" th:if="${b.status == 'REJECTED'}">Rejected</span>
                            <span class="badge badge-pending" th:if="${b.status == 'PENDING'}">Pending Approval</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${#lists.isEmpty(bookings)}" class="empty-state" style="padding: 60px; background: white; border-radius: 12px; border: 1px solid #eee;">
            <p style="font-size: 1.2rem; margin-bottom: 20px;">You haven't registered for any events yet.</p>
            <a th:href="@{/}" class="btn-approve" style="display: inline-block; padding: 12px 30px;">Explore Upcoming Events →</a>
        </div>
    </div>
</div>

<!-- Footer Fragment -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/login.js}"></script>
</body>
</html>
