<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Calendar | Faculty of Technology</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo1.png}">
    <meta name="description" content="View all upcoming events and approved bookings on the interactive calendar for the Faculty of Technology, University of Ruhuna.">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>


<div th:replace="~{fragments/header :: header}"></div>


<section class="calendar-hero">
    <div class="calendar-hero-content">
        <i class="fas fa-calendar-alt"></i>
        <h1>Event Calendar</h1>
        <p>Browse all upcoming events and approved venue bookings at a glance</p>
    </div>
</section>


<section class="calendar-section">
    <div class="calendar-wrapper">


        <div class="calendar-main">
            <div class="calendar-header">
                <button id="prevMonth" class="cal-nav-btn" aria-label="Previous month">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <div class="cal-title-block">
                    <h2 id="calMonthYear"></h2>
                    <button id="todayBtn" class="cal-today-btn">Today</button>
                </div>
                <button id="nextMonth" class="cal-nav-btn" aria-label="Next month">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>


            <div class="cal-days-header">
                <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span>
                <span>Thu</span><span>Fri</span><span>Sat</span>
            </div>


            <div id="calendarGrid" class="cal-grid"></div>
        </div>


        <div class="calendar-sidebar" id="calendarSidebar">
            <div class="sidebar-header">
                <h3 id="sidebarDate">Select a date</h3>
                <span id="sidebarCount" class="sidebar-count"></span>
            </div>
            <div id="sidebarEvents" class="sidebar-events">
                <div class="sidebar-empty">
                    <i class="fas fa-calendar-day"></i>
                    <p>Click a date on the calendar to view events</p>
                </div>
            </div>
        </div>

    </div>


    <div class="cal-legend">
        <div class="legend-item">
            <span class="legend-dot legend-event"></span> Events
        </div>
        <div class="legend-item">
            <span class="legend-dot legend-booking"></span> Approved Bookings
        </div>
    </div>
</section>


<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/login.js}"></script>

<script>
    (function() {
        'use strict';

        let currentDate = new Date();
        let calendarEvents = [];
        let selectedDate = null;

        const monthNames = [
            'January','February','March','April','May','June',
            'July','August','September','October','November','December'
        ];


        const grid = document.getElementById('calendarGrid');
        const monthYear = document.getElementById('calMonthYear');
        const prevBtn = document.getElementById('prevMonth');
        const nextBtn = document.getElementById('nextMonth');
        const todayBtn = document.getElementById('todayBtn');
        const sidebarDate = document.getElementById('sidebarDate');
        const sidebarCount = document.getElementById('sidebarCount');
        const sidebarEvents = document.getElementById('sidebarEvents');


        async function fetchEvents() {
            try {
                const res = await fetch('/api/calendar/events');
                calendarEvents = await res.json();
            } catch(e) {
                console.error('Failed to load calendar events', e);
                calendarEvents = [];
            }
            renderCalendar();
        }

        function getEventsForDate(dateStr) {
            return calendarEvents.filter(ev => ev.date === dateStr);
        }

        function formatDateStr(year, month, day) {
            return year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            monthYear.textContent = monthNames[month] + ' ' + year;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrev = new Date(year, month, 0).getDate();

            const today = new Date();
            const todayStr = formatDateStr(today.getFullYear(), today.getMonth(), today.getDate());

            grid.innerHTML = '';


            for (let i = firstDay - 1; i >= 0; i--) {
                const day = daysInPrev - i;
                const cell = createDayCell(day, true, '');
                grid.appendChild(cell);
            }


            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = formatDateStr(year, month, d);
                const isToday = dateStr === todayStr;
                const isSelected = dateStr === selectedDate;
                const events = getEventsForDate(dateStr);
                const cell = createDayCell(d, false, dateStr, isToday, isSelected, events);
                grid.appendChild(cell);
            }


            const totalCells = grid.children.length;
            const remaining = (7 - (totalCells % 7)) % 7;
            for (let i = 1; i <= remaining; i++) {
                const cell = createDayCell(i, true, '');
                grid.appendChild(cell);
            }
        }

        function createDayCell(day, isOther, dateStr, isToday, isSelected, events) {
            const cell = document.createElement('div');
            cell.className = 'cal-cell';
            if (isOther) cell.classList.add('other-month');
            if (isToday) cell.classList.add('today');
            if (isSelected) cell.classList.add('selected');

            const num = document.createElement('span');
            num.className = 'cal-day-num';
            num.textContent = day;
            cell.appendChild(num);

            if (events && events.length > 0) {
                cell.classList.add('has-events');
                const dots = document.createElement('div');
                dots.className = 'cal-dots';

                const hasEvent = events.some(e => e.type === 'EVENT');
                const hasBooking = events.some(e => e.type === 'BOOKING');

                if (hasEvent) {
                    const dot = document.createElement('span');
                    dot.className = 'dot dot-event';
                    dots.appendChild(dot);
                }
                if (hasBooking) {
                    const dot = document.createElement('span');
                    dot.className = 'dot dot-booking';
                    dots.appendChild(dot);
                }

                cell.appendChild(dots);
            }

            if (!isOther && dateStr) {
                cell.addEventListener('click', function() {
                    selectDate(dateStr, day);
                });
            }

            return cell;
        }

        function selectDate(dateStr, day) {
            selectedDate = dateStr;
            renderCalendar();
            showSidebarEvents(dateStr);
        }

        function showSidebarEvents(dateStr) {
            const events = getEventsForDate(dateStr);
            const parts = dateStr.split('-');
            const dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            sidebarDate.textContent = dateObj.toLocaleDateString('en-US', options);

            if (events.length === 0) {
                sidebarCount.textContent = '';
                sidebarEvents.innerHTML = `
                    <div class="sidebar-empty">
                        <i class="fas fa-calendar-xmark"></i>
                        <p>No events scheduled for this date</p>
                    </div>`;
                return;
            }

            sidebarCount.textContent = events.length + ' event' + (events.length > 1 ? 's' : '');

            sidebarEvents.innerHTML = '';
            events.forEach(function(ev, idx) {
                const card = document.createElement('div');
                card.className = 'sidebar-event-card';
                card.style.animationDelay = (idx * 0.08) + 's';

                const typeClass = ev.type === 'EVENT' ? 'type-event' : 'type-booking';
                const typeLabel = ev.type === 'EVENT' ? 'Event' : 'Booking';
                const typeIcon = ev.type === 'EVENT' ? 'fa-star' : 'fa-bookmark';

                let imgHTML = '';
                if (ev.image) {
                    imgHTML = '<div class="se-image"><img src="' + ev.image + '" alt="' + ev.title + '"></div>';
                }

                card.innerHTML = `
                    ${imgHTML}
                    <div class="se-content">
                        <span class="se-type ${typeClass}">
                            <i class="fas ${typeIcon}"></i> ${typeLabel}
                        </span>
                        <h4>${ev.title}</h4>
                        ${ev.time ? '<p class="se-meta"><i class="fas fa-clock"></i> ' + ev.time + '</p>' : ''}
                        ${ev.venue ? '<p class="se-meta"><i class="fas fa-location-dot"></i> ' + ev.venue + '</p>' : ''}
                        ${ev.description ? '<p class="se-desc">' + ev.description + '</p>' : ''}
                    </div>`;

                sidebarEvents.appendChild(card);
            });
        }


        prevBtn.addEventListener('click', function() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        nextBtn.addEventListener('click', function() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        todayBtn.addEventListener('click', function() {
            currentDate = new Date();
            const today = new Date();
            selectedDate = formatDateStr(today.getFullYear(), today.getMonth(), today.getDate());
            renderCalendar();
            showSidebarEvents(selectedDate);
        });


        fetchEvents();
    })();
</script>

</body>
</html>
